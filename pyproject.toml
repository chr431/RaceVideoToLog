[project]
name = "RaceVideoToLog"
version = "2.7.0"
description = "从赛车视频中 OCR 提取速度数据，生成时间-速度-距离 CSV（TensorRT + CPU 双后端）"
requires-python = ">=3.11"
dependencies = [
    "rapidocr>=3.9",
    "onnxruntime>=1.27",
    "numpy>=2",
    "matplotlib>=3.10",
    "PySide6>=6.11",
    "PySide6-Fluent-Widgets>=1.11",
    "decord",
    "pyclipper",
    "shapely",
]
# opencv-python-headless is a transitive dep of rapidocr — no longer used directly.

[project.optional-dependencies]
dev = ["pytest>=8"]
gpu = [
    "cuda-python",
    "tensorrt_cu13_bindings>=10,<11",
]
# tensorrt (meta-package) is intentionally omitted: it pulls in
# tensorrt_libs (~2.2 GB of DLLs).  Runtime DLLs are loaded from the
# system (CUDA Toolkit + TensorRT on PATH).

[project.scripts]
racevideotolog = "RaceVideoToLog:main"

[tool.setuptools]
py-modules = [
    "RaceVideoToLog",
    "analysis",
    "config",
    "correction",
    "error_detection",
    "gpu_setup",
    "gui",
    "gui_analysis",
    "gui_export",
    "gui_review",
    "gui_settings",
    "headless",
    "ocr_engine",
    "pipeline",
    "theme_manager",
    "viterbi",
    "widget_utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
