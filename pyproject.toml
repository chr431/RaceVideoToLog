[project]
name = "RaceVideoToLog"
version = "2.17.1"
description = "从赛车视频中 OCR 提取速度数据，生成时间-速度-距离 CSV（TensorRT + CPU 双后端）"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.28",  # 1.28：protobuf CVE 修复；CPU 推理与本模型无差（实测 1.27=1.28）
    "numpy>=2",
    "PySide6-Essentials>=6.11",
    "pyqtgraph>=0.14",  # 只装核心模块，省 Addons (~300MB: QtWebEngine 等)
    "PySide6-Fluent-Widgets>=1.11",
    "cuda-python",
    "tensorrt_cu13_bindings>=11,<12",
    # decord 已从 PyPI 依赖中移除：本仓库依赖自建 fork（chr431/decord）
    # 的 next_roi / get_codec / GPU 动态加载 / CPU 内存修复，PyPI 版无法满足。
    # 由 setup_venv.bat 从 _decord_build/（decord 发布产物）安装，见 README。
    "psutil>=6",
    # ── 引擎（独立仓库 chr431/video_ocr_engine）──
    # 2026-08-30 起由 git submodule 改为 pip 依赖 + tag 锁定。
    # 原因：submodule 会 detached HEAD、可本地提交、易与上游脱节
    # （曾出现本地 commit 未被上游吸收 + 陈旧本地分支落后 90 个提交）。
    # 改为 pip 依赖后：版本由本行锁定，CI 与全新环境可复现。
    # 本地开发需要改引擎时，执行 `pip install -e <引擎源码树>` 覆盖为
    # 源码直连即可（setup_venv.bat 已自动处理）。
    "video-ocr-engine @ git+https://github.com/chr431/video_ocr_engine.git@v0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# cuda-python / tensorrt_cu13_bindings 为主依赖：OcrEngine TRT 引擎
# import tensorrt (shim -> tensorrt_bindings) 与 decord GPU DLL 注册必需。
# tensorrt (meta-package) is intentionally omitted: it pulls in
# tensorrt_libs (~2.2 GB of DLLs).  Runtime DLLs are loaded from the
# system (CUDA Toolkit + TensorRT on PATH).

[project.scripts]
racevideotolog = "RaceVideoToLog:main"

[tool.setuptools]
# 引擎（video_ocr_engine 包 + engine_config/segmentation/hybrid_decode/
# ocr_native/ocr_trt/video_utils/gpu_setup 顶层模块）为独立仓库，
# 以 pip 依赖方式提供（见上方 dependencies），不再是本项目的打包单元。
py-modules = [
    "RaceVideoToLog",
    "analysis",
    "analysis_plot",
    "config",
    "constants",
    "csv_io",
    "export_controller",
    "gui",
    "gui_analysis",
    "gui_export",
    "gui_preview",
    "gui_review",
    "gui_settings",
    "gui_video",
    "headless",
    "logging_setup",
    "monitor",
    "ocr_engine",
    "ocr_text",
    "review_chart",
    "seg_correction",
    "segment_flow",
    "signals",
    "theme_manager",
    "video_utils_app",
    "widget_utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
