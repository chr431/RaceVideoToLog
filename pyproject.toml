[project]
name = "RaceVideoToLog"
version = "2.5.0"
description = "从赛车视频中 OCR 提取速度数据，生成时间-速度-距离 CSV（TensorRT + CPU 双后端）"
requires-python = ">=3.11"
dependencies = [
    "rapidocr>=3.9",
    "onnxruntime>=1.27",
    "opencv-python-headless>=5",
    "numpy>=2",
    "matplotlib>=3.10",
    "PySide6>=6.11",
    "PySide6-Fluent-Widgets>=1.11",
    "decord",
    "pyclipper",
    "shapely",
]
# GPU 加速（可选）：
#   pip install tensorrt cuda-python
#   CUDA Toolkit 12.x + TensorRT 10.x bin 目录加入 PATH

[project.scripts]
racevideotolog = "RaceVideoToLog:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
