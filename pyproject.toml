[project]
name = "RaceVideoToLog"
version = "2.10.0"
description = "从赛车视频中 OCR 提取速度数据，生成时间-速度-距离 CSV（TensorRT + CPU 双后端）"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.27",
    "numpy>=2",
    "PySide6-Essentials>=6.11",
    "pyqtgraph>=0.14",  # 只装核心模块，省 Addons (~300MB: QtWebEngine 等)
    "PySide6-Fluent-Widgets>=1.11",
    "cuda-python",
    "tensorrt_cu13_bindings>=10,<11",
    "decord",
    "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# cuda-python / tensorrt_cu13_bindings 为主依赖：OcrEngine TRT 引擎
# import tensorrt (shim -> tensorrt_bindings) 与 decord GPU DLL 注册必需。
# tensorrt (meta-package) is intentionally omitted: it pulls in
# tensorrt_libs (~2.2 GB of DLLs).  Runtime DLLs are loaded from the
# system (CUDA Toolkit + TensorRT on PATH).

[project.scripts]
racevideotolog = "RaceVideoToLog:main"

[tool.setuptools]
py-modules = [
    "RaceVideoToLog",
    "analysis",
    "config",
    "constants",
    "correction",
    "csv_io",
    "error_detection",
    "gpu_setup",
    "gui",
    "gui_analysis",
    "gui_export",
    "gui_preview",
    "gui_review",
    "gui_settings",
    "headless",
    "monitor",
    "ocr_engine",
    "ocr_native",
    "ocr_text",
    "pipeline",
    "signals",
    "theme_manager",
    "video_utils",
    "viterbi",
    "widget_utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
