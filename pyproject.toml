[project]
name = "RaceVideoToLog"
version = "3.0.0-dev"
description = "从赛车视频中 OCR 提取速度数据，生成时间-速度-距离 CSV (PaddlePaddle 后端)"
requires-python = ">=3.11"
dependencies = [
    "rapidocr>=3.9",
    "paddlepaddle-gpu>=3.3",
    "opencv-python-headless>=5",
    "numpy>=2",
    "matplotlib>=3.10",
    "PySide6>=6.11",
    "PySide6-Fluent-Widgets>=1.11",
    "decord",
    "pyclipper",
    "shapely",
]

[project.scripts]
racevideotolog = "RaceVideoToLog:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
