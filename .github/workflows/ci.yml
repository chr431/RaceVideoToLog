name: CI

on:
  push:
    branches: [dev, master, feature/*]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    if: github.ref_name != 'master'  # master is the release branch (no tests/)
    runs-on: windows-latest
    steps:
      # 引擎 video_ocr_engine 已 pip 化，版本由 pyproject.toml 的 git tag
      # 锁定，由下面的 `pip install -e .` 拉取 —— 不再需要 submodule checkout。
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e .
      - name: Install test runner
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/ -v
        env:
          PYTHONIOENCODING: utf-8  # 中文 skip reason 在 GBK 控制台崩溃（曾致 decoder-smoke 误红）

  decoder-smoke:
    # 解码集成测试：真实运行 CPU 软解冒烟（无需 GPU）。decord fork wheel 是
    # pyproject.toml 直接 URL 依赖，随 `pip install -e .` 一并安装 ——
    # 安装失败即环境不可用，直接红（不再"下载失败→显式跳过"的宽容语义）。
    if: github.ref_name != 'master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest
      - name: Decoder integration tests
        run: python -m pytest tests/test_decoder_integration.py -v -rs
        env:
          PYTHONIOENCODING: utf-8  # 中文 skip reason 在 GBK 控制台崩溃

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify all version references
        run: python tools/version.py
