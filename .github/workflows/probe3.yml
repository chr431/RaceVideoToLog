name: CI-Probe3

on:
  push:
    branches: [ci-probe]

jobs:
  p3-test:
    if: github.ref_name != 'master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "test job"
  p3-decoder:
    if: github.ref_name != 'master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          pip install -e .
          pip install pytest
      - name: Download decord fork release (v0.7.7)
        continue-on-error: true
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/chr431/decord/releases/download/v0.7.7/decord-0.7.7-win64-gpu.zip" -OutFile "$env:RUNNER_TEMP\decord.zip"
          Expand-Archive "$env:RUNNER_TEMP\decord.zip" -DestinationPath "_decord_build" -Force
      - name: hashfiles-echo
        if: hashFiles('_decord_build/python/decord/video_reader.py') != ''
        shell: pwsh
        run: |
          echo "hashfiles-echo step"
      - name: Report decoder availability (explicit skip reason when absent)
        shell: pwsh
        run: |
          python -c "import decord, inspect, decord.video_reader as v" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "warn"
          }
  p3-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "version"

